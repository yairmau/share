<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }} · {{ site.author }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  {% if site.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | escape }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="https://yairmau.com/">Yair Mau</a>
    <span class="sep">/</span>
    <a class="site-section" href="{{ '/' | relative_url }}">share</a>
  </header>

  <main>
    {% if page.title and page.url != "/" %}
    <article>
      <h1>{{ page.title }}</h1>
      {% if page.date %}<p class="meta">{{ page.date | date: "%-d %B %Y" }}</p>{% endif %}
      {{ content }}
    </article>
    {% else %}
    {{ content }}
    {% endif %}
  </main>

  <footer class="site-footer">
    <a href="{{ '/' | relative_url }}">All shared pages</a> · <a href="https://yairmau.com/">yairmau.com</a>
  </footer>

  <script>
    // Add a copy button to every code block.
    // Works on every code block, including ones added to future pages.
    // The button sits outside the <pre>, and the text is read from the block
    // itself at click time, so only the block's own content is copied.
    function legacyCopy(text) {
      // Fallback for browsers or connections (e.g. plain http) where
      // navigator.clipboard is unavailable.
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.left = "0";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length); // needed on iOS Safari
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      window.getSelection && window.getSelection().removeAllRanges();
      return ok;
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(function () {
          if (!legacyCopy(text)) throw new Error("copy failed");
        });
      }
      return legacyCopy(text) ? Promise.resolve() : Promise.reject(new Error("copy failed"));
    }

    document.querySelectorAll("pre").forEach(function (pre) {
      var wrap = document.createElement("div");
      wrap.className = "code-wrap";
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);

      var btn = document.createElement("button");
      btn.className = "copy";
      btn.type = "button";
      btn.textContent = "Copy";
      btn.addEventListener("click", function () {
        var source = pre.querySelector("code") || pre;
        var text = source.textContent.replace(/\n$/, "");
        copyText(text).then(function () {
          btn.textContent = "Copied";
        }, function () {
          btn.textContent = "Select and copy manually";
        }).then(function () {
          setTimeout(function () { btn.textContent = "Copy"; }, 2000);
        });
      });
      wrap.appendChild(btn);
    });
  </script>
</body>
</html>
